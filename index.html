main{position:relative;z-index:1}
.ex,.pcard,.att,.stat,.gcard,.banner,.empty,.days button{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,18,32,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--accent)}
.top .wrap{padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1;border-left:5px solid var(--accent);padding-left:9px}
.date{color:var(--muted);font-size:13px;text-align:right}
.who{display:grid;gap:4px;min-width:0}
.athlete{justify-self:start;border:0;background:none;padding:0 0 0 14px;font-size:13px;color:var(--muted);text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.athlete b{color:var(--fg);font-weight:600}
.athlete.empty-name{color:#ff6b72;text-decoration:underline}
.name-in{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--fg);font:inherit;font-size:18px;padding:0 12px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;display:grid;line-height:1.15}
.days b{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase}
.days small{font-size:11px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.85}
main .wrap{padding-block:14px 170px;display:grid;gap:12px}
.progress-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.ex.complete{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.ex-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ex-head>div:first-child{min-width:0}
.mus{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.moved{color:var(--warn)}
h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ord{display:flex;gap:4px;flex-shrink:0}
.icon{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-size:16px;line-height:1}
.icon:disabled{opacity:.35;cursor:default}
.last{font-size:13px;background:var(--sunk);border-radius:9px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.last span{color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.chip.up{background:var(--good-soft);color:var(--good)}

/* ---------- Logica progressi ---------- */
function setsOf(s,exId){return ((s.log||{})[exId]||[]).filter(x=>x&&x.done&&!isNaN(num(x.reps)))}
function history(exId,excludeId){
  return Object.values(sessions).filter(s=>s.id!==excludeId&&setsOf(s,exId).length).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).map(s=>({date:s.date,day:s.day,sets:setsOf(s,exId)}));
}
function metric(sets){
  const bw=sets.every(x=>!(num(x.kg)>0));
  if(bw)return{v:sets.reduce((a,x)=>a+num(x.reps),0),bw:true,top:Math.max(...sets.map(x=>num(x.reps)))};
  let best=0,top=0;sets.forEach(x=>{const k=num(x.kg)||0,r=num(x.reps);best=Math.max(best,k*(1+r/30));top=Math.max(top,k)});
  return{v:best,bw:false,top};
}
function slotInfo(exId){for(const d of DAYS)for(const e of d.ex)if(e[0]===exId)return e;return null}
function analyze(exId,hi,nSets,excludeId){
  const h=history(exId,excludeId);
  if(!h.length)return{status:'none',h};
  const last=h[h.length-1];
  const lm=metric(last.sets);
  const info=slotInfo(exId);
  const top=hi||(info?info[3]:12), need=nSets||(info?info[1]:3);
  const allTop=last.sets.length>=need&&last.sets.every(x=>num(x.reps)>=top);
  if(h.length===1)return{status:allTop?'inc':'new',h,last,lm};
  const ms=h.map(x=>metric(x.sets).v);
  const diff=(a,b)=>(a-b)/(b||1);
  const d1=diff(ms[ms.length-1],ms[ms.length-2]);
  let streak=0;for(let i=ms.length-1;i>0;i--){if(diff(ms[i],ms[i-1])<-0.01)streak++;else break}
  let status=d1>0.01?'up':d1<-0.01?'down':'flat';
  if(streak>=2)status='down2';
  else if(allTop)status='inc';
  let flatRun=0;for(let i=ms.length-1;i>0;i--){if(Math.abs(diff(ms[i],ms[i-1]))<=0.01)flatRun++;else break}
  return{status,h,last,lm,d1,streak,flatRun,prev:h[h.length-2]};
}
const LABEL={up:'In crescita',flat:'Stabile',down:'In calo',down2:'Calo ripetuto',inc:'Aumenta il peso',new:'Prima seduta'};
function setsTxt(sets){return sets.map(x=>(num(x.kg)>0?fmtKg(num(x.kg))+'×':'')+num(x.reps)).join(' · ')}
function adviceText(a,exId){
  if(!a||a.status==='none')return'';
  if(a.status==='inc'){const t=a.lm.top;return a.lm.bw?'Hai chiuso tutte le serie al massimo delle ripetizioni: aggiungi zavorra o rallenta la discesa.':'Hai chiuso tutte le serie al massimo delle ripetizioni: oggi prova '+fmtKg(t+2.5)+' kg (o il salto più piccolo disponibile).'}
  if(a.status==='down2')return'Calo per '+a.streak+' sedute di fila. Controlla sonno, alimentazione e recupero; se continua, scala il carico del 10% per una settimana.';
  if(a.status==='flat'&&a.flatRun>=2)return'Fermo da '+(a.flatRun+1)+' sedute: punta a una ripetizione in più per serie prima di aumentare il peso.';
  return'';
}

/* ---------- Frequenza ---------- */
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const GOAL=4;
function trainedDates(){return [...new Set(Object.values(sessions).filter(s=>Object.keys(s.log||{}).some(k=>setsOf(s,k).length)).map(s=>s.date))].sort()}
function attendance(){
  const dates=trainedDates(), set=new Set(dates), now=new Date(), today=todayStr();
  const mon=monday(now), wk=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);wk.push(dStr(d))}
  const thisWeek=wk.filter(d=>set.has(d)).length;
  const weeks=[];
  for(let w=7;w>=0;w--){const s=new Date(mon);s.setDate(mon.getDate()-7*w);const e=new Date(s);e.setDate(s.getDate()+7);weeks.push({start:s,n:dates.filter(d=>{const x=toD(d);return x>=s&&x<e}).length,cur:w===0})}
  const last=dates[dates.length-1];
  const gap=last?Math.round((toD(today)-toD(last))/864e5):null;
  const firstMon=dates.length?monday(toD(dates[0])):null;
  const full=weeks.filter(w=>!w.cur&&firstMon&&w.start>=firstMon).slice(-4);
  const avg=full.length?full.reduce((a,w)=>a+w.n,0)/full.length:null;
  const daysLeft=7-(now.getDay()+6)%7-(set.has(today)?1:0);
  const missing=Math.max(0,GOAL-thisWeek);
  let v;
  if(!dates.length)v={c:'ok',t:'Nessun allenamento registrato',d:'Appena completi una serie, la giornata viene segnata qui in automatico.'};
  else if(gap>=4)v={c:'bad',t:'Sono '+gap+' giorni che non ti alleni',d:'Così ogni muscolo rischia di lavorare una volta sola a settimana. Rientra con l\'allenamento segnato come Prossimo.'};
  else if(thisWeek>=GOAL)v={c:'good',t:'Obiettivo della settimana raggiunto',d:thisWeek+' allenamenti su '+GOAL+'. Ottimo, adesso recupera bene.'};
  else if(missing>daysLeft)v={c:'warn',t:'Questa settimana non arrivi a '+GOAL,d:'Ne hai fatti '+thisWeek+'. Fanne almeno '+Math.min(3,thisWeek+daysLeft)+' e lunedì riparti da dove eri rimasto.'};
  else if(gap===0)v={c:'good',t:'Allenamento di oggi segnato',d:'Questa settimana '+thisWeek+' su '+GOAL+': ne mancano '+missing+'.'};
  else v={c:'ok',t:'Sei in linea',d:'Questa settimana '+thisWeek+' su '+GOAL+': ne mancano '+missing+' e hai ancora '+daysLeft+' '+(daysLeft===1?'giorno':'giorni')+'.'};
  let trend=null;
  if(avg!=null&&full.length>=2){trend=avg>=3.5?{c:'good',t:'Costante',d:'Media '+fmtKg(Math.round(avg*10)/10)+' allenamenti a settimana nelle ultime '+full.length+' settimane.'}:avg>=2.5?{c:'warn',t:'Quasi costante',d:'Media '+fmtKg(Math.round(avg*10)/10)+' a settimana: con 4 su 4 alleni ogni muscolo due volte.'}:{c:'bad',t:'Poco costante',d:'Media '+fmtKg(Math.round(avg*10)/10)+' a settimana: troppo poco per far crescere i carichi. Punta ad almeno 3.'}}
  return{dates,set,wk,today,thisWeek,weeks,last,gap,v,trend};
}
function renderAttendance(){
  const a=attendance(), L=['L','M','M','G','V','S','D'];
  const week=a.wk.map((d,i)=>`<div><i class="${a.set.has(d)?'on':''}${d===a.today?' today':''}${d>a.today?' future':''}">${a.set.has(d)?'✓':''}</i>${L[i]}</div>`).join('');
  const H=84,max=Math.max(GOAL+1,...a.weeks.map(w=>w.n));
  const bars=a.weeks.map(w=>`<div class="col" title="${w.n} allenamenti"><i class="${w.cur?'cur':w.n>=GOAL?'full':''}" style="height:${Math.max(3,w.n/max*(H-4))}px"></i></div>`).join('');
  const labels=a.weeks.map(w=>`<span>${w.cur?'ora':w.start.getDate()+'/'+(w.start.getMonth()+1)}</span>`).join('');
  return `<section class="att"><div class="att-head"><div><span class="mus">Questa settimana</span><br><b>${a.thisWeek}/${GOAL}</b></div><span>${a.last?'Ultimo allenamento: '+(a.gap===0?'oggi':a.gap===1?'ieri':fmtDate(a.last)+', '+a.gap+' giorni fa'):''}</span></div>
  <div class="week">${week}</div>
  <div class="verdict ${a.v.c}"><strong>${a.v.t}</strong><span>${a.v.d}</span></div>
  <div><span class="mus">Ultime 8 settimane</span><div class="weeks"><div class="target" style="bottom:${GOAL/max*(H-4)}px"></div>${bars}</div><div class="weeks-l">${labels}</div></div>
  ${a.trend?`<div class="verdict ${a.trend.c}"><strong>${a.trend.t}</strong><span>${a.trend.d}</span></div>`:''}
  <p class="note">Un giorno viene segnato da solo quando completi almeno una serie. La linea tratteggiata è l'obiettivo di ${GOAL} allenamenti.</p></section>`;
}
function banner(){
  const a=attendance();if(!a.dates.length)return'';
  return `<a class="banner" href="#progressi"><b>Settimana ${a.thisWeek}/${GOAL}</b><span>${a.v.t}</span></a>`;
}

function nextDay(){

  if(!done.length){const i=DAYS.findIndex(d=>d.wd===new Date().getDay());return i>=0?i:0}

function saveProgram(p,restoredIdx){

function chartSvg(h){
  const pts=h.map(x=>{const m=metric(x.sets);return{date:x.date,y:m.bw?m.top:m.top,bw:m.bw,e:m.v}});
  const W=320,H=130,L=34,R=10,T=12,B=22;
  const ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys);
  const lo=mn===mx?mn-1:mn-(mx-mn)*.15,hi=mn===mx?mx+1:mx+(mx-mn)*.15;
  const X=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1);
  const Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const line=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const area=pts.length>1?`<polygon points="${X(0)},${H-B} ${line} ${X(pts.length-1)},${H-B}" fill="var(--accent-soft)"/>`:'';
  const grid=[mn,mx].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmtKg(v)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:2.5}" fill="${i===pts.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="2"/>`).join('');
  const dl=`<text x="${X(0)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}">${fmtDate(pts[0].date)}</text>`+(pts.length>1?`<text x="${X(pts.length-1)}" y="${H-6}" text-anchor="end">${fmtDate(pts[pts.length-1].date)}</text>`:'');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento ${pts[0].bw?'ripetizioni':'carico massimo'}">${grid}${area}${pts.length>1?`<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:''}${dots}${dl}</svg>`;
}
function renderProgress(){
  const ids=[...new Set(Object.values(sessions).flatMap(s=>Object.keys(s.log||{})))].filter(id=>C[id]&&history(id).length);
  if(!ids.length)return renderAttendance()+`<div class="empty"><b>Ancora nessun dato</b>Completa le serie nella sezione Allenamento: qui vedrai per ogni esercizio il grafico dei carichi e se stai migliorando, sei fermo o stai calando.</div>`;
  const items=ids.map(id=>({id,a:analyze(id)}));
  const cnt=k=>items.filter(i=>k.includes(i.a.status)).length;
  const nSess=Object.values(sessions).filter(s=>Object.keys(s.log||{}).some(k=>setsOf(s,k).length)).length;
  const order={down2:0,down:1,inc:2,flat:3,up:4,new:5};
  items.sort((x,y)=>order[x.a.status]-order[y.a.status]);
  const groups={};items.forEach(i=>{(groups[C[i.id].m]=groups[C[i.id].m]||[]).push(i)});
  const cards=items.map(({id,a})=>{
    const m=a.lm, prev=a.prev;
    const cmp=prev?`Ora ${setsTxt(a.last.sets)} · prima ${setsTxt(prev.sets)}`:`Prima seduta: ${setsTxt(a.last.sets)}`;
    const adv=adviceText(a,id);
    return `<article class="pcard"><div class="row"><div><span class="mus">${C[id].m}</span><h3>${esc(C[id].n)}</h3></div><span class="chip ${a.status}">${LABEL[a.status]}</span></div>
    ${chartSvg(a.h)}
    <p>${a.lm.bw?'Ripetizioni massime':'Kg massimi'} per seduta · ${a.h.length} ${a.h.length===1?'seduta':'sedute'}${!m.bw?' · 1RM stimato '+fmtKg(Math.round(m.v*2)/2)+' kg':''}</p>
    <p>${cmp}</p>${adv?`<div class="hint ${a.status==='down2'?'down2':'inc'}">${adv}</div>`:''}</article>`;
  }).join('');
  return renderAttendance()+`<h2 class="section-title">Carichi</h2><div class="summary"><div class="stat up"><b>${cnt(['up','inc'])}</b><span>in crescita</span></div><div class="stat"><b>${cnt(['flat','new'])}</b><span>stabili</span></div><div class="stat down"><b>${cnt(['down','down2'])}</b><span>in calo</span></div></div>
  <p class="note">${nSess} ${nSess===1?'seduta registrata':'sedute registrate'}. Il confronto usa la serie migliore di ogni seduta (1RM stimato): ad esempio 90×6 e poi 90×5 risulta in calo.</p>${cards}`;
}
function renderGuide(){
  const d=DAYS[dayIdx];
  return d.ex.map(e=>guideCard(e[0])).join('')+`<p class="note">I video si aprono su YouTube in una nuova scheda.</p>`;
}
function guideCard(id){const c=C[id];return `<article class="gcard"><span class="mus">${c.m}</span><h3>${esc(c.n)}</h3><ul>${c.t.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><a class="yt" href="${yt(c.n)}" target="_blank" rel="noopener">▶ Guarda il video su YouTube</a></article>`}

/* ---------- Sheet ---------- */
function openSheet(html){$('#sheetbody').innerHTML=html+`<button class="btn" data-act="close">Chiudi</button>`;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* ---------- Timer ---------- */
let tEnd=0,tInt=null,tName='',actx=null,goT=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;g.gain.value=.15;os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec,name){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  clearTimeout(goT);tEnd=Date.now()+sec*1000;tName=name;$('#timer').hidden=false;$('#tbox').classList.remove('go');
  clearInterval(tInt);tick();tInt=setInterval(tick,250);
}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  $('#tnum').textContent=Math.floor(left/60)+':'+pad(left%60);
  $('#tlabel').textContent='Recupero · '+tName;
  if(left<=0){clearInterval(tInt);$('#tbox').classList.add('go');$('#tlabel').textContent='Pronto';$('#tnum').textContent='Vai!';beep();goT=setTimeout(()=>{$('#timer').hidden=true},5000)}
}
$('#tplus').onclick=()=>{tEnd+=15000;if($('#tbox').classList.contains('go')){tEnd=Date.now()+15000;startTimer(15,tName)}};
$('#tminus').onclick=()=>{tEnd-=15000;tick()};
$('#tstop').onclick=()=>{clearInterval(tInt);clearTimeout(goT);$('#timer').hidden=true};

/* ---------- Eventi ---------- */
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.f)return;
  const s=getSession(),ex=t.dataset.ex,k=+t.dataset.k;
  s.log[ex]=s.log[ex]||[];s.log[ex][k]=Object.assign({},s.log[ex][k]||{}, {[t.dataset.f]:t.value.trim()});
  persist(s);
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-day]');if(!b)return;
  if(b.dataset.day!=null){dayIdx=+b.dataset.day;ls.set('scheda-day',dayIdx);render();window.scrollTo(0,0);return}
  const act=b.dataset.act,s=getSession();
  if(act==='close'){closeSheet();return}
  if(act==='imp-open'){openImport();return}
  if(act==='sw-toggle'){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(swRun){swAcc+=Date.now()-swStart;swRun=false;clearInterval(swInt)}else{swStart=Date.now();swRun=true;clearInterval(swInt);swInt=setInterval(updateSw,100)}swRefresh();return}
  if(act==='sw-lap'){const tot=swNow(),prev=swLaps.length?swLaps[swLaps.length-1].tot:0;swLaps.push({lap:tot-prev,tot});swRefresh();return}
  if(act==='sw-reset'){swRun=false;swAcc=0;swLaps=[];clearInterval(swInt);swRefresh();return}
  if(act==='cd'){startTimer(+b.dataset.s,'Timer libero');return}
  if(act==='cd-custom'){const m=parseInt($('#cd-m').value)||0,sc=parseInt($('#cd-s').value)||0,t=m*60+sc;if(t>0)startTimer(Math.min(t,5999),'Timer libero');return}
  if(act==='bk-export'){exportBackup();return}
  if(act==='bk-copy'){const t=document.querySelector('.bk-text');if(!t)return;const p=navigator.clipboard&&navigator.clipboard.writeText(t.value);if(p)p.then(()=>{b.textContent='Copiato'},()=>{t.select()});else t.select();return}
  if(act==='bk-apply'){applyBackup();return}
  if(act==='bk-cancel'){bkPending=null;$('#bk-status').textContent='';return}
  if(act==='name-edit'){openSheet(`<h2>Nome dello sportivo</h2><label class="note" for="name-in">Compare in alto in ogni schermata e sulla scheda.</label><input class="name-in" id="name-in" autocomplete="name" maxlength="40" value="${esc(profile.name||'')}" placeholder="Es. Marco Rossi"><button class="btn primary" data-act="name-save">Salva</button>`);setTimeout(()=>{const i=$('#name-in');if(i)i.focus()},50);return}
  if(act==='name-save'){const i=$('#name-in');saveProfile((i?i.value:'').trim());closeSheet();render();return}
  if(act==='imp-go'){runImport();return}
  if(act==='imp-apply'){if(impPending){saveProgram(impPending);impPending=null}closeSheet();render();window.scrollTo(0,0);return}
  if(act==='reset'){$('#reset-confirm').innerHTML='<div class="confirm">Torni alla scheda ipertrofia originale. I carichi registrati restano salvati.<div class="actions"><button class="btn primary" data-act="reset-yes">Sì, torna all\'originale</button><button class="btn" data-act="reset-no">Annulla</button></div></div>';return}
  if(act==='arch-view'){const e=program.archive[+b.dataset.i];if(!e)return;if(!e.base)Object.assign(C,e.cat||{});openSheet(`<span class="mus">Archivio</span><h2>${esc(e.name)}</h2>`+progDays(e).map(dayTable).join(''));return}
  if(act==='arch-restore'){const i=+b.dataset.i,e=program.archive[i];if(!e)return;saveProgram(e.base?{reset:true}:{name:e.name,days:e.days,cat:e.cat||{}},i);render();window.scrollTo(0,0);return}
  if(act==='sess-view'){const x=sessions[b.dataset.id];if(!x)return;const rows=Object.keys(x.log).filter(k=>C[k]&&setsOf(x,k).length).map(k=>`<li><b>${esc(C[k].n)}</b><br><span class="note">${setsTxt(setsOf(x,k))}</span></li>`).join('');openSheet(`<span class="mus">${new Date(toD(x.date)).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</span><h2>${esc(dayName(x))}</h2><ul>${rows}</ul>`);return}
  if(act==='reset-no'){$('#reset-confirm').innerHTML='';return}
  if(act==='reset-yes'){saveProgram({reset:true});render();return}
  if(act==='done'){
    const ex=b.dataset.ex,k=+b.dataset.k,slot=+b.dataset.slot,row=b.closest('.set');
    const kgI=row.querySelector('[data-f="kg"]'),rpI=row.querySelector('[data-f="reps"]');
    s.log[ex]=s.log[ex]||[];const x=Object.assign({},s.log[ex][k]||{});
    if(x.done){x.done=false}
    else{
      const kg=kgI.value.trim()||(isNaN(num(kgI.placeholder))?'':kgI.placeholder);
      const rp=rpI.value.trim()||(/^\d+$/.test(rpI.placeholder)?rpI.placeholder:'');
      if(rp===''){rpI.focus();rpI.setAttribute('aria-invalid','true');return}
      x.kg=kg===''?'0':kg;x.reps=rp;x.done=true;
      if(ls.get('scheda-autorest',false))startTimer(DAYS[dayIdx].ex[slot][5],C[ex].n);
    }
    s.log[ex][k]=x;persist(s);render();return;
  }
  if(act==='up'||act==='down'){const p=+b.dataset.pos,q=act==='up'?p-1:p+1;[s.order[p],s.order[q]]=[s.order[q],s.order[p]];persist(s);render();return}
  if(act==='later'){const p=+b.dataset.pos;const slot=s.order.splice(p,1)[0];s.order.push(slot);s.moved[slot]=true;persist(s);render();return}
  if(act==='guide'){const c=C[b.dataset.ex];openSheet(`<span class="mus">${c.m}</span><h2>${esc(c.n)}</h2><ul>${c.t.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><a class="yt" href="${yt(c.n)}" target="_blank" rel="noopener">▶ Guarda il video su YouTube</a>`);return}
  if(act==='swap'){
    const slot=+b.dataset.slot,orig=DAYS[dayIdx].ex[slot][0],cur=slotEx(s,slot);
    const opts=[orig,...C[orig].a];
    openSheet(`<span class="mus">${C[orig].m}</span><h2>Scegli un'alternativa</h2><p class="note">Stesso muscolo, stesse serie e ripetizioni. I carichi vengono salvati sotto l'esercizio che fai davvero.</p>`+
      opts.map(id=>`<button class="alt${id===cur?' on':''}" data-act="pick" data-slot="${slot}" data-id="${id}"><span>${esc(C[id].n)}${id===orig?' <small>(originale)</small>':''}</span><small>${id===cur?'in uso':''}</small></button>`).join(''));
    return;
  }
  if(act==='pick'){const slot=+b.dataset.slot,id=b.dataset.id,orig=DAYS[dayIdx].ex[slot][0];if(id===orig)delete s.subs[slot];else s.subs[slot]=id;persist(s);closeSheet();render();return}
});
function route(){const h=location.hash.slice(1);view=['allenamento','progressi','timer','scheda','guida'].includes(h)?h:'allenamento';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
document.addEventListener('change',e=>{if(e.target.id==='autorest'){ls.set('scheda-autorest',e.target.checked);return}if(e.target.id==='bk-file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>readBackup(String(r.result));r.readAsText(f);e.target.value='';return}if(e.target.id==='imp-photo'){impFiles=[...e.target.files];const c=$('#imp-count');if(c)c.textContent=impFiles.length?impFiles.length+(impFiles.length===1?' foto aggiunta':' foto aggiunte'):''}});
$('#today').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
route();
</script>
