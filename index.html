<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Project DMD"><meta name="theme-color" content="#0a0c0f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{background:#0a0c0f}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Project DMD Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app da strumento a una colonna; intestazione con logo, contenuto, dock del timer fisso sopra il menu in basso */
:root{
  --bg:#0a0c0f; --bg2:#0f1216; --surface:#13171d; --surface2:#1a1f27; --line:#242a33; --line2:#313844;
  --fg:#edf0f4; --muted:#8a94a3; --dim:#5b6472;
  --accent:#42c6f2; --accent-ink:#04141b; --accent-soft:rgba(66,198,242,.12); --accent-line:rgba(66,198,242,.4);
  --good:#3fd98a; --good-soft:rgba(63,217,138,.13); --warn:#f2b54a; --warn-soft:rgba(242,181,74,.13); --bad:#ff5a6a; --bad-soft:rgba(255,90,106,.13);
  --display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(120% 60% at 50% -10%,rgba(66,198,242,.10),transparent 60%),
  linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px) 0 0/28px 28px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,12,15,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px;display:grid;gap:8px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:15px;width:auto;display:block;opacity:.95}
.athlete{border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.athlete b{color:var(--fg);font-weight:600}
.athlete.unset{color:var(--accent)}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.04em;margin:0;text-transform:uppercase;line-height:1.05}
.sub{font-size:12px;color:var(--muted);font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
main{position:relative;z-index:1}
main .wrap{padding-block:14px calc(250px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
body.dock-min main .wrap{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
/* type */
.eyebrow{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2.sec{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;margin:2px 0 4px;text-wrap:balance}
.note{font-size:12px;color:var(--muted);margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.card.tight{gap:6px}
.card>*,.ed-ex>*,.sheet>*{min-width:0}
.edbar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:rgba(15,18,22,.96);border:1px solid var(--line2);border-radius:14px;box-shadow:0 10px 30px rgb(0 0 0 / .5)}
.edbar .btn{padding:12px 8px}
.edbar .main{grid-column:1/-1}
body.no-dock .dock{display:none}
body.no-dock main .wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.row>div{min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:500;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:6px 10px;font-size:12px}
.btn.block{width:100%;padding:13px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.icon{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface2);display:grid;place-items:center;font-size:15px;line-height:1;flex-shrink:0}
.icon:disabled{opacity:.3;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent;font-family:var(--body)}
.chip.up{background:var(--good-soft);color:var(--good)}
.chip.flat{background:var(--surface2);color:var(--muted);border-color:var(--line2)}
.chip.down{background:var(--warn-soft);color:var(--warn)}
.chip.down2{background:var(--bad-soft);color:var(--bad)}
.chip.inc{background:var(--accent-soft);color:var(--accent)}
.chip.new{background:transparent;color:var(--muted);border:1px dashed var(--line2)}
.chip.pr{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;display:grid;gap:6px;border:1px solid var(--line)}
.banner strong{font-size:14px}
.banner.info{background:var(--accent-soft);border-color:var(--accent-line)}
.banner.warn{background:var(--warn-soft);border-color:rgba(242,181,74,.35)} .banner.warn strong{color:var(--warn)}
.banner.bad{background:var(--bad-soft);border-color:rgba(255,90,106,.35)} .banner.bad strong{color:var(--bad)}
.banner.good{background:var(--good-soft);border-color:rgba(63,217,138,.3)} .banner.good strong{color:var(--good)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
/* days */
.days{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);overflow-x:auto}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;display:grid;line-height:1.15;min-width:64px}
.days b{font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days small{font-size:10px;color:var(--muted);letter-spacing:.04em}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button[aria-pressed="true"] small{color:inherit;opacity:.8}
/* workout */
.sesshead{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.ex.cur{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)}
.ex.complete{border-color:rgba(63,217,138,.45)}
.ex-title{border:0;background:none;padding:0;text-align:left;display:block;width:100%}
.ex-title h3{display:inline}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.ord{display:flex;gap:4px;flex-shrink:0}
.last{font-size:12.5px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-variant-numeric:tabular-nums}
.last span{color:var(--muted)}
.hint{font-size:13px;border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint.inc{background:var(--accent-soft)} .hint.down2{background:var(--bad-soft)} .hint.flat{background:var(--surface2)} .hint.deload{background:var(--warn-soft)}
.exnote{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line2);padding-left:8px;white-space:pre-wrap}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:30px minmax(0,1fr) 12px minmax(0,1fr) 46px;gap:6px;align-items:center}
.set label{font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.field{position:relative;min-width:0}
.field input{width:100%;height:46px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);font-family:var(--display);font-weight:600;font-size:21px;padding:0 32px 0 10px;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--muted);opacity:.8}
.field em{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;font-size:10px;color:var(--dim);pointer-events:none;text-transform:uppercase;letter-spacing:.06em}
.x{color:var(--dim);font-size:12px;text-align:center}
.check{height:46px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-size:19px;color:var(--muted)}
.set.done .check{background:var(--good);border-color:var(--good);color:#04160c}
.set.done input{border-color:rgba(63,217,138,.5)}
.set .pr-star{position:absolute;left:-2px;top:-6px;font-size:10px;color:var(--warn)}
.set label{position:relative}
.finish{display:grid;gap:8px}
/* timer dock */
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.dbox{grid-template-columns:minmax(0,1fr);max-width:664px;margin:0 auto 6px;background:rgba(19,23,29,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line2);border-radius:16px;padding:8px 10px 10px;display:grid;gap:6px;box-shadow:0 12px 32px rgb(0 0 0 / .5)}
.dbox.running{border-color:var(--accent-line)}
.dbox.done{border-color:var(--good);background:rgba(13,40,26,.97)}
.dtop{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dlabel{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.dlabel b{color:var(--fg);font-weight:600}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:transparent;padding:4px 8px;font-size:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg)}
.dmin{border:0;background:none;color:var(--muted);font-size:16px;width:28px;height:24px;flex-shrink:0}
.dmain{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.dtime{border:0;background:none;padding:0;min-width:0;font-family:var(--display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center}
.dbox.running .dtime{color:var(--accent)}
.dbox.done .dtime{color:var(--good)}
.dadj{width:52px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-family:var(--display);font-weight:600;font-size:15px}
.dctrl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:6px}
.dctrl button{min-width:0;height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--surface2);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.dctrl .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px}
.dctrl .go.pause{background:var(--warn);border-color:var(--warn);color:#1b1200}
.dbox.min .dmain,.dbox.min .dctrl{display:none}
.dminrow{display:none;align-items:center;gap:8px}
.dbox.min .dminrow{display:flex}
.dminrow .t{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;flex:1}
.dbox.min.running .dminrow .t{color:var(--accent)}
.dminrow button{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);font-weight:700;font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.dminrow .go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(10,12,15,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{height:58px;display:grid;place-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--dim);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nav a svg{width:21px;height:21px}
.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"] svg{color:var(--accent)}
/* progress */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;color:var(--muted)}
.stat.up b{color:var(--good)} .stat.down b{color:var(--bad)} .stat.acc b{color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:4px;justify-items:center;font-size:11px;color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--line2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.week i.on{background:var(--accent);border:1.5px solid var(--accent);color:var(--accent-ink)}
.week i.today{border-color:var(--fg)}
.week i.future{opacity:.45}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal span{font-size:10px;color:var(--dim);padding-bottom:2px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:9px;border:1px solid transparent;background:transparent;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);display:grid;place-items:center;padding:0;position:relative}
.cal button.plan{border-color:var(--line2);border-style:dashed}
.cal button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal button.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.search{width:100%;height:44px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);padding:0 12px;font-size:15px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex-shrink:0;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li>div{min-width:0}
.li b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.li small{color:var(--muted);font-size:12px}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{min-width:130px}
.tm{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
/* programs */
.prog.active{border-color:var(--accent-line)}
.weekbar{display:flex;gap:3px}
.weekbar i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.weekbar i.done{background:var(--accent)}
.weekbar i.now{background:var(--fg)}
.weekbar i.dl{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,transparent 3px 6px);border:1px solid var(--warn)}
.weekbar i.dl.done{background:var(--warn)}
/* editor */
.ed-field{display:grid;gap:4px;min-width:0}
.ed-field label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.ed-field input,.ed-field select,.ed-field textarea,.inp{width:100%;height:42px;border:1px solid var(--line2);border-radius:9px;background:var(--bg2);padding:0 10px;font-size:15px;min-width:0}
.ed-field textarea,textarea.inp{height:auto;padding:10px;resize:vertical}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ed-grid.g6{grid-template-columns:repeat(3,minmax(0,1fr))}
.ed-ex{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--bg2)}
.ed-ex .pick{border:1px solid var(--line2);background:var(--surface2);border-radius:9px;padding:9px 10px;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;min-width:0}
.ed-ex .pick b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-chips{display:flex;flex-wrap:wrap;gap:6px}
.dl-chips button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-family:var(--display);font-weight:600;font-size:13px;color:var(--muted)}
.dl-chips button[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1b1200}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper b{font-family:var(--display);font-size:44px;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .6);display:flex;align-items:flex-end}
.sheet{background:var(--bg2);width:100%;max-width:680px;margin:0 auto;border-radius:18px 18px 0 0;border-top:1px solid var(--line2);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:88vh;overflow:auto;min-width:0}
.sheet h2{font-family:var(--display);font-size:24px;margin:0;line-height:1.05}
.sheet ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.alt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:12px}
.alt.on{border-color:var(--accent);background:var(--accent-soft)}
.alt small{color:var(--muted)}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--accent);font-weight:600;font-size:14px}
.confirm{display:grid;gap:8px;background:var(--warn-soft);border:1px solid rgba(242,181,74,.3);border-radius:10px;padding:10px 12px;font-size:13px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;display:grid;gap:6px;justify-items:center}
.files{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;margin-bottom:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle:last-child{border-bottom:0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:30;background:var(--surface2);border:1px solid var(--warn);color:var(--fg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgb(0 0 0 / .5);max-width:calc(100% - 32px)}
.sw-big{display:grid;justify-items:center;gap:16px;text-align:center}
.sw-big .t{font-family:var(--display);font-weight:700;font-size:clamp(56px,19vw,96px);line-height:1;font-variant-numeric:tabular-nums}
.laps{list-style:none;margin:0;padding:0;width:100%;display:grid;font-variant-numeric:tabular-nums;font-size:14px}
.laps li{display:flex;justify-content:space-between;padding:8px 4px;border-top:1px solid var(--line)}
.laps li span{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ================= Utility ================= */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>dStr(new Date());
const toD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const daysBetween=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_L=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const fmtDate=s=>{const d=toD(s);return d.getDate()+' '+MESI[d.getMonth()]};
const fmtDateL=s=>toD(s).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
const fmtKg=k=>String(Math.round(k*100)/100).replace('.',',');
const fmtInt=n=>Math.round(n).toLocaleString('it-IT');
const fmtRest=s=>{s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m?m+"'"+(r?pad(r)+'"':''):r+'"'};
const fmtClock=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)+' min'};
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(',','.'))};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yt=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' esecuzione corretta');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const clampInt=(v,a,b,d)=>{const n=Math.round(Number(v));return isFinite(n)&&n>=a&&n<=b?n:d};
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},2600)}

/* ================= Lettura schede (parser) ================= */
function parseRest(str){
  if(!str)return NaN;let s=String(str).toLowerCase().replace(/’|′/g,"'").replace(/”|″/g,'"');
  const parts=s.split(/\s*[–—-]\s*|\s+a\s+/).filter(Boolean);
  const one=p=>{let m;
    if((m=p.match(/(\d+)\s*:\s*(\d{1,2})/)))return +m[1]*60+ +m[2];
    if((m=p.match(/(\d+(?:[.,]\d+)?)\s*'\s*(\d{1,2})?\s*"?/)))return Math.round(num(m[1])*60)+(m[2]?+m[2]:0);
    if((m=p.match(/(\d+(?:[.,]\d+)?)\s*(?:min|m\b)/)))return Math.round(num(m[1])*60);
    if((m=p.match(/(\d+)\s*(?:"|sec|s\b|secondi)/)))return +m[1];
    if((m=p.match(/^(\d+)$/)))return +m[1]<=10?+m[1]*60:+m[1];
    return NaN};
  let vals=parts.map(one);
  // "90–120"" : il primo numero eredita l'unità del secondo
  if(parts.length===2&&/^\d+$/.test(parts[0].trim())&&isFinite(vals[1])){const u=/'|min/.test(parts[1])?60:1;vals[0]=+parts[0]*u}
  vals=vals.filter(isFinite);if(!vals.length)return NaN;
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function parseReps(str){
  const s=String(str||'').replace(/\s/g,'');const m=s.match(/(\d{1,3})(?:[–—\-\/a](\d{1,3}))?/);
  if(!m)return null;const lo=+m[1],hi=m[2]?+m[2]:lo;return{lo:Math.min(lo,hi),hi:Math.max(lo,hi),note:/gamba/i.test(str)?'/gamba':/lato/i.test(str)?'/lato':''};
}
const MUSCLE_KW=[['Petto',/panca|chest|pec|croci|dip|petto|push ?up|flessioni/],['Dorso',/lat|rematore|row|trazion|pull|pulley|dorso|stacco(?! rumeno)|deadlift(?! rom)/],['Spalle',/shoulder|spall|alzate lat|military|lento|face pull|rear|deltoid|arnold/],['Bicipiti',/curl(?!.*leg)|bicip|hammer|scott|preacher/],['Tricipiti',/tricip|pushdown|push down|french|estension.*(testa|cavo|manubr)|kickback|skull/],['Quadricipiti',/squat|leg press|pressa|leg ext|affond|lunge|hack|quadric/],['Femorali',/leg curl|femoral|romanian|rumeno|rdl|good morning|stacco rumeno/],['Glutei',/hip thrust|glute|slanci|abductor|abduct|ponte|bulgar|step ?up/],['Polpacci',/calf|polpacc/],['Addome',/crunch|addom|plank|leg raise|alzate gambe|ab wheel|woodchop|pallof|russian/]];
function guessMuscle(name){const n=norm(name);for(const[m,r]of MUSCLE_KW)if(r.test(n))return m;return'Altro'}
const WD_MAP={lunedi:1,martedi:2,mercoledi:3,giovedi:4,venerdi:5,sabato:6,domenica:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6,sunday:0};
function weekdayOf(s){const n=norm(s);for(const k in WD_MAP)if(n.includes(k))return WD_MAP[k];return -1}
/* Parser senza IA: testo libero o tabelle (CSV, Excel, PDF) -> struttura grezza */
function parseTableRows(rows){
  const H=rows[0].map(norm);const col=re=>H.findIndex(h=>re.test(h));
  const c={day:col(/^(giorno|day|seduta|allenamento|sessione)/),ex:col(/esercizi|exercise|movimento|nome/),mus:col(/gruppo|muscol|distretto|muscle/),sets:col(/^serie|sets?$|^set\b/),reps:col(/rip|reps?|ripetizion/),rir:col(/rir|rpe/),rest:col(/rec|rest|pausa|riposo/),kg:col(/kg|carico|peso|load|weight/),note:col(/note|indicaz|tecnica/)};
  if(c.ex<0)return null;
  const days=[];let cur=null;
  rows.slice(1).forEach(r=>{
    const g=k=>c[k]>=0?String(r[c[k]]??'').trim():'';
    const dn=g('day');if(dn&&(!cur||norm(dn)!==norm(cur.name))){cur={name:dn.replace(/\s*[–-]\s*/,' ').slice(0,30),weekday:dn,exercises:[]};days.push(cur)}
    const name=g('ex');if(!name)return;
    if(!cur){cur={name:'Giorno 1',weekday:'',exercises:[]};days.push(cur)}
    const rp=parseReps(g('reps'))||{lo:8,hi:12,note:''};
    cur.exercises.push({name,muscle:g('mus')||guessMuscle(name),sets:parseInt(g('sets'))||3,reps_min:rp.lo,reps_max:rp.hi,reps_note:rp.note,rir:g('rir')||'1',rest_seconds:parseRest(g('rest'))||90,kg:num(g('kg'))||'',notes:g('note')});
  });
  return days.length?{title:'',days}:null;
}
function splitRow(line){if(line.includes('\t'))return line.split('\t');if((line.match(/;/g)||[]).length>=2)return line.split(';');if((line.match(/,/g)||[]).length>=3&&!/\d,\d/.test(line))return line.split(',');return null}
function parseFreeText(text){
  const lines=String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  // tabella?
  const hi=lines.findIndex(l=>{const r=splitRow(l);return r&&r.some(c=>/esercizi|exercise/i.test(c))});
  if(hi>=0){const rows=lines.slice(hi).map(splitRow).filter(Boolean).map(r=>r.map(x=>x.replace(/^"|"$/g,'')));const t=parseTableRows(rows);if(t)return t}
  const days=[];let cur=null,frag='',lastEx=null,fromFrag=false,pendingHi=null;
  const WDRE=/^(luned|marted|mercoled|gioved|venerd|sabato|domenica)\S*/i;
  const SPLITRE=/^(upper|lower|push|pull|legs|gambe|full ?body)\b/i;
  const DAYRE=/^(giorno\s*\d+|day\s*\d+|seduta\s*\S+|allenamento\s+[a-z0-9]\b|scheda\s+[a-z0-9]\b)/i;
  const muscleWords=new Set(['petto','dorso','spalle','bicipiti','tricipiti','quadricipiti','femorali','glutei','polpacci','addome','gambe','braccia','schiena']);
  const newDay=(name,wd,open)=>{cur={name:name.slice(0,30),weekday:wd||name,exercises:[],open};days.push(cur);frag='';lastEx=null;fromFrag=false};
  const restOf=str=>{const t=str.replace(/\d+(?:[.,]\d+)?\s*kg/ig,' ');let m=t.match(/rec(?:upero)?\.?\s*:?\s*([\d'"’”:–\- ]+(?:sec|min|s)?)/i);if(m)return parseRest(m[1]);m=t.match(/(\d+\s*(?:'\s*\d*)?["'’”]?(?:\s*[–-]\s*\d+\s*(?:'\s*\d*)?["'’”]?)?)\s*$/);return m&&/['"’”]/.test(m[1])?parseRest(m[1]):NaN};
  for(const raw of lines){
    let l=raw.replace(/\s+/g,' ').trim();
    if(/^giorno\s+gruppo|^esercizio\s+serie|^(giorno|esercizio)\s+(serie|gruppo)/i.test(l))continue;
    // continuazioni della riga precedente
    if(pendingHi&&/^(\d{1,3})\s*(\/\s*(gamba|lato))?$/i.test(l)){const m=l.match(/^(\d{1,3})/);pendingHi.reps_max=Math.max(pendingHi.reps_min,+m[1]);if(/gamba/i.test(l))pendingHi.reps_note='/gamba';if(/lato/i.test(l))pendingHi.reps_note='/lato';pendingHi=null;continue}
    // intestazioni di giorno
    const wdm=l.match(WDRE);
    if(wdm&&!/\d+\s*[x×]\s*\d/.test(l)&&l.length<40&&!/\s\d{1,2}\s+\d/.test(l)){const rest=l.slice(wdm[0].length).replace(/^\s*[–:\-]\s*/,'').trim();newDay((wdm[0]+(rest?' '+rest:'')).trim(),l,!rest);continue}
    if(SPLITRE.test(l)&&l.length<20&&!/\d+\s*[x×]/.test(l)){if(cur&&cur.open){cur.name=(cur.name+' '+l).slice(0,30);cur.open=false}else newDay(l,'',false);continue}
    if(DAYRE.test(l)&&!/\d+\s*[x×]\s*\d/.test(l)){newDay(l.replace(/\s*[–:\-]\s*$/,'').replace(/\s*[–-]\s*/,' · '),l,false);continue}
    let m=l.match(/(\d{1,2})\s*[x×X\*]\s*(\d{1,3})(?:\s*[–—\-\/]\s*(\d{1,3}))?/),sets,lo,hi,pos,len,noHi=false;
    if(m){sets=+m[1];lo=+m[2];hi=m[3]?+m[3]:lo;pos=m.index;len=m[0].length}
    else if((m=l.match(/(?:^|\s)(\d{1,2})\s+(\d{1,3})\s*[–—\-]\s*(\d{1,3})(?:\s*\/\s*(?:gamba|lato))?(?=\s|$)/))){sets=+m[1];lo=+m[2];hi=+m[3];pos=m.index;len=m[0].length}
    else if(/^\d{1,3}\s*[–-]$/.test(frag)&&(m=l.match(/(?:^|\s)(\d{1,2})\s+(?=\d(?:\s*[–-]\s*\d)?\s+\S*['"’”])/))){sets=+m[1];lo=parseInt(frag);hi=lo;noHi=true;pos=m.index;len=m[0].length}
    if(!m){
      if(fromFrag&&lastEx&&/^[a-zà-ù°\/ ]{1,20}$|^\d{1,3}°$/i.test(l)&&l.length<22){lastEx.name=(lastEx.name+(/–$/.test(lastEx.name)?'':' ')+l).trim();fromFrag=false;continue}
      frag=l;continue}
    let name=l.slice(0,pos).trim();
    const w=name.split(' ');let mus='';
    if(muscleWords.has(norm(w[0]))){mus=w[0];name=w.slice(1).join(' ')}
    name=name.replace(/^[-•*\d.)\s]+(?=[a-zà-ù])/i,'').trim();
    fromFrag=false;
    if(!name||muscleWords.has(norm(name))){if(frag&&!/^\d/.test(frag)){name=frag.replace(/^\S+\s+/,w=>muscleWords.has(norm(w))?'':w).trim();fromFrag=true}else continue}
    const after=l.slice(pos+len);
    const rirM=after.match(/rir\s*(\d(?:\s*[–-]\s*\d)?)/i)||after.match(/^\s*(?:\/\s*(?:gamba|lato)\s*)?(\d(?:\s*[–-]\s*\d)?)(?=\s)/);
    const kgM=after.match(/(\d+(?:[.,]\d+)?)\s*kg/i);
    if(!cur)newDay('Giorno 1','',false);
    const ex={name,muscle:mus?mus[0].toUpperCase()+mus.slice(1).toLowerCase():guessMuscle(name),sets,reps_min:lo,reps_max:hi,reps_note:/gamba/i.test(l)?'/gamba':/lato/i.test(l)?'/lato':'',rir:rirM?rirM[1].replace(/\s*-\s*/,'–'):'1',rest_seconds:restOf(after)||90,kg:kgM?num(kgM[1]):''};
    cur.exercises.push(ex);cur.open=cur.open&&cur.exercises.length<2;lastEx=ex;pendingHi=noHi?ex:null;frag='';
  }
  return{title:'',days:days.filter(d=>d.exercises.length)};
}

function history(exId,excludeId){
  return trainedSessions().filter(s=>s.id!==excludeId&&setsOf(s,exId).length).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).map(s=>({id:s.id,date:s.date,sets:setsOf(s,exId)}));
}
const e1rm=(kg,r)=>kg*(1+r/30);
function metric(sets){
  const bw=sets.every(x=>!(num(x.kg)>0));
  if(bw)return{v:sets.reduce((a,x)=>a+num(x.reps),0),bw:true,top:Math.max(...sets.map(x=>num(x.reps))),vol:0};
  let best=0,top=0,vol=0;sets.forEach(x=>{const k=num(x.kg)||0,r=num(x.reps);best=Math.max(best,e1rm(k,r));top=Math.max(top,k);vol+=k*r});
  return{v:best,bw:false,top,vol};
}
function records(exId,excludeId){
  const h=history(exId,excludeId);let e=0,kg=0,vol=0,reps=0,eD='',kgD='',volD='';
  h.forEach(x=>{const m=metric(x.sets);x.sets.forEach(s=>{const k=num(s.kg)||0,r=num(s.reps);if(k>0&&e1rm(k,r)>e){e=e1rm(k,r);eD=x.date}if(k>kg){kg=k;kgD=x.date}if(r>reps)reps=r});if(m.vol>vol){vol=m.vol;volD=x.date}});
  return{e,kg,vol,reps,eD,kgD,volD,n:h.length};
}
function analyze(exId,hi,nSets,excludeId){
  const h=history(exId,excludeId);
  if(!h.length)return{status:'none',h};
  const last=h[h.length-1],lm=metric(last.sets);
  const allTop=last.sets.length>=(nSets||3)&&last.sets.every(x=>num(x.reps)>=(hi||12));
  if(h.length===1)return{status:allTop?'inc':'new',h,last,lm,allTop};
  const ms=h.map(x=>metric(x.sets).v),diff=(a,b)=>(a-b)/(b||1);
  const d1=diff(ms[ms.length-1],ms[ms.length-2]);
  let streak=0;for(let i=ms.length-1;i>0;i--){if(diff(ms[i],ms[i-1])<-0.01)streak++;else break}
  let flatRun=0;for(let i=ms.length-1;i>0;i--){if(Math.abs(diff(ms[i],ms[i-1]))<=0.01)flatRun++;else break}
  let status=d1>0.01?'up':d1<-0.01?'down':'flat';
  if(streak>=2)status='down2';else if(allTop)status='inc';
  return{status,h,last,lm,d1,streak,flatRun,prev:h[h.length-2],allTop};
}
const LABEL={up:'In crescita',flat:'Stabile',down:'In calo',down2:'Calo ripetuto',inc:'Aumenta il peso',new:'Prima seduta',none:'Nessun dato'};
const setsTxt=sets=>sets.map(x=>(num(x.kg)>0?fmtKg(num(x.kg))+'×':'')+num(x.reps)).join(' · ');
function suggestion(a,exId){
  if(!a||a.status==='none')return null;
  const step=/bilanciere|squat|stacco|deadlift|leg press|hip thrust|hack/i.test(X(exId).n)?2.5:1.25;
  if(a.status==='inc'){if(a.lm.bw)return{cls:'inc',t:'Tutte le serie al massimo delle ripetizioni: aggiungi zavorra o rallenta la discesa.'};const kg=a.lm.top+step*2>a.lm.top*1.06?a.lm.top+step:a.lm.top+step*2;return{cls:'inc',t:'Hai chiuso tutte le serie al massimo: prova '+fmtKg(kg)+' kg.',kg}}
  if(a.status==='down2')return{cls:'down2',t:'In calo da '+a.streak+' sedute. Controlla sonno e recupero; se continua, scala il carico del 10% per una settimana.'};
  if(a.status==='flat'&&a.flatRun>=2)return{cls:'flat',t:'Fermo da '+(a.flatRun+1)+' sedute: punta a una ripetizione in più per serie, poi aumenta.'};
  return null;
}

let cur=null; // {exId,slot,rest,name}
function attendance(){
  const dates=trainedDates(),set=new Set(dates),now=new Date(),today=todayStr(),mon=monday(now),wk=[];
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);wk.push(dStr(d))}
  const p=activeProg(),goal=Math.max(1,p.days.length);
  const thisWeek=wk.filter(d=>set.has(d)).length;
  const weeks=[];for(let w=7;w>=0;w--){const s=new Date(mon);s.setDate(mon.getDate()-7*w);const e=new Date(s);e.setDate(s.getDate()+7);weeks.push({start:s,n:dates.filter(d=>{const x=toD(d);return x>=s&&x<e}).length,cur:w===0})}
  const last=dates[dates.length-1],gap=last?daysBetween(last,today):null;
  const daysLeft=7-(now.getDay()+6)%7-(set.has(today)?1:0),missing=Math.max(0,goal-thisWeek);
  let v;
  if(!dates.length)v={c:'info',t:'Nessun allenamento registrato',d:'Appena completi una serie, la giornata viene segnata in automatico.'};
  else if(gap>=4)v={c:'bad',t:'Sono '+gap+' giorni che non ti alleni',d:'Ogni muscolo rischia di lavorare una volta sola a settimana. Rientra con l\'allenamento segnato come Prossimo.'};
  else if(thisWeek>=goal)v={c:'good',t:'Obiettivo della settimana raggiunto',d:thisWeek+' allenamenti su '+goal+'. Adesso recupera bene.'};
  else if(missing>daysLeft)v={c:'warn',t:'Questa settimana non arrivi a '+goal,d:'Ne hai fatti '+thisWeek+'. Fanne il più possibile e lunedì riparti da dove eri rimasto.'};
  else v={c:'info',t:gap===0?'Allenamento di oggi segnato':'Sei in linea',d:'Questa settimana '+thisWeek+' su '+goal+': ne mancano '+missing+(gap===0?'.':' e hai ancora '+daysLeft+' '+(daysLeft===1?'giorno':'giorni')+'.')};
  return{dates,set,wk,today,thisWeek,goal,weeks,last,gap,v};
}

/* ================= Timer di recupero (solo avvio manuale) e cronometro ================= */
const T={mode:'rest',preset:90,left:90,running:false,paused:false,end:0,done:false,sw:{acc:0,start:0,run:false,laps:[]}};
let actx=null,tInt=null;
function audioUnlock(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){if(prefs.sound!==false){try{audioUnlock();[0,.3,.6].forEach((o,i)=>{const os=actx.createOscillator(),g=actx.createGain();os.type='sine';os.frequency.value=i===2?1320:880;g.gain.setValueAtTime(.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+o+.22);os.connect(g);g.connect(actx.destination);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+.25)})}catch(e){}}
  if(prefs.vib!==false){try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400])}catch(e){}}}
function tick(){
  if(T.running){T.left=(T.end-Date.now())/1000;if(T.left<=0){T.left=0;T.running=false;T.paused=false;T.done=true;beep();toast('Recupero finito: serie successiva')}}
  updateDock();const el=view==='allenamento'&&$('#elapsed');if(el){const s=sessions[getSession().id];if(s&&s.start)el.textContent=fmtDur((s.end&&s.finished?s.end:Date.now())-s.start)}

const swNow=()=>T.sw.acc+(T.sw.run?Date.now()-T.sw.start:0);
function fmtSw(ms){const t=Math.floor(ms/100),d=t%10,s=Math.floor(t/10)%60,m=Math.floor(t/600)%60,h=Math.floor(t/36000);return(h?h+':'+pad(m):pad(m))+':'+pad(s)+','+d}
function updateDock(){
  const box=$('#dbox'),mini=!!prefs.dockMin||(view!=='allenamento'&&!T.running&&!T.sw.run);box.classList.toggle('min',mini);document.body.classList.toggle('dock-min',mini);document.body.classList.toggle('no-dock',view==='edit');
  $('#dminbtn').textContent=mini?'▴':'▾';$('#dminbtn').setAttribute('aria-label',mini?'Espandi timer':'Riduci timer');
  $('#m-rest').setAttribute('aria-pressed',T.mode==='rest');$('#m-sw').setAttribute('aria-pressed',T.mode==='sw');

    $('#dlabel').innerHTML=T.done?'<b>Recupero finito</b> · tocca Start per ripartire':cur?'<b>'+esc(cur.name)+'</b>':'Recupero';
    box.classList.toggle('running',T.running);box.classList.toggle('done',T.done&&!T.running);
    const lab=T.running?'Pausa':T.paused?'Riprendi':'Start';go.textContent=lab;go2.textContent=lab;go.classList.toggle('pause',T.running);
    const st=prefs.step||15;$('#adjm').textContent='−'+st;$('#adjp').textContent='+'+st;$('#adjm').dataset.d=-st;$('#adjp').dataset.d=st;
    $('#adjm').style.visibility='';$('#adjp').style.visibility='';$('#t-extra').textContent='+'+(st*2);$('#t-reset').textContent='Azzera';$('#dtime').disabled=false;
  }else{

    $('#dlabel').innerHTML='Cronometro'+(T.sw.laps.length?' · '+T.sw.laps.length+' giri':'');

    $('#adjm').style.visibility='hidden';$('#adjp').style.visibility='hidden';$('#t-extra').textContent='Giro';$('#t-reset').textContent='Azzera';$('#dtime').disabled=true;
  }

  if(need&&!tInt)tInt=setInterval(tick,200);else if(!need&&tInt){clearInterval(tInt);tInt=null}
}
function timerGo(){
  audioUnlock();
  if(T.mode==='sw'){if(T.sw.run){T.sw.acc+=Date.now()-T.sw.start;T.sw.run=false}else{T.sw.start=Date.now();T.sw.run=true}updateDock();if(view==='profilo')render();return}
  if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);T.running=false;T.paused=true}
  else{if(T.done||T.left<=0){T.left=T.preset;T.done=false}T.end=Date.now()+T.left*1000;T.running=true;T.paused=false}

}
function timerReset(){if(T.mode==='sw'){T.sw={acc:0,start:0,run:false,laps:[]};updateDock();return}T.running=false;T.paused=false;T.done=false;T.preset=cur?cur.rest:T.preset;T.left=T.preset;updateDock()}

let calMonth=null,exQuery='';
function sessionStats(s){let sets=0,reps=0,vol=0,exs=0;Object.keys(s.log||{}).forEach(k=>{const ss=setsOf(s,k);if(ss.length)exs++;ss.forEach(x=>{sets++;reps+=num(x.reps);vol+=(num(x.kg)||0)*num(x.reps)})});return{sets,reps,vol,exs}}
function chartSvg(pts,opts={}){
  if(!pts.length)return'';
  const W=320,H=opts.h||130,L=38,R=10,T=12,B=22,ys=pts.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys);
  const lo=mn===mx?mn-1:mn-(mx-mn)*.15,hi=mn===mx?mx+1:mx+(mx-mn)*.15;
  const Xp=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const line=pts.map((p,i)=>Xp(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ');
  const grid=[mn,mx].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)" stroke-dasharray="3 3"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${opts.int?fmtInt(v):fmtKg(Math.round(v*10)/10)}</text>`).join('');
  const area=pts.length>1?`<polygon points="${Xp(0)},${H-B} ${line} ${Xp(pts.length-1)},${H-B}" fill="var(--accent-soft)"/>`:'';
  const dots=pts.map((p,i)=>`<circle cx="${Xp(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:2.5}" fill="${p.pr?'var(--warn)':i===pts.length-1?'var(--accent)':'var(--bg2)'}" stroke="${p.pr?'var(--warn)':'var(--accent)'}" stroke-width="2"/>`).join('');
  const dl=`<text x="${Xp(0)}" y="${H-6}" text-anchor="${pts.length===1?'middle':'start'}">${fmtDate(pts[0].date)}</text>`+(pts.length>1?`<text x="${Xp(pts.length-1)}" y="${H-6}" text-anchor="end">${fmtDate(pts[pts.length-1].date)}</text>`:'');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Andamento')}">${grid}${area}${pts.length>1?`<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`:''}${dots}${dl}</svg>`;
}

  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return'Scegli «Salva in File» per conservarlo.'}}catch(e){if(e&&e.name==='AbortError')return'Annullato.'}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6000);return'File scaricato.';

async function fileToText(f,st){
  const name=f.name.toLowerCase();
  if(/\.(csv|txt)$/.test(name)||f.type.startsWith('text/'))return{text:await f.text()};
  if(/\.(xlsx|xls|ods)$/.test(name)){st('Leggo il file Excel…');await loadScript(XLSX_SRC);const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return{text:wb.SheetNames.map(n=>'### '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n],{FS:'\t',blankrows:false})).join('\n\n')}}
  if(/\.pdf$/.test(name)||f.type==='application/pdf'){
    st('Leggo il PDF…');await loadScript(PDFW_SRC);await loadScript(PDFJS_SRC);try{pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW_SRC}catch(e){}
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let text='';const imgs=[];
    for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();
      const lines={};tc.items.forEach(it=>{const y=Math.round(it.transform[5]/3)*3;(lines[y]=lines[y]||[]).push({x:it.transform[4],s:it.str})});
      text+=Object.keys(lines).sort((a,b)=>b-a).map(y=>lines[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean).join('\n')+'\n';
      if(i<=4){const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;imgs.push(await new Promise(r=>c.toBlob(r,'image/jpeg',.82)))}}
    return{text,imgs};
  }
  if(f.type.startsWith('image/')||/\.(png|jpe?g|heic|webp)$/.test(name))return{img:f};
  return{text:''};
}

  const days=(Array.isArray(j.days)?j.days:[]).filter(d=>Array.isArray(d.exercises)&&d.exercises.length).map((d,i)=>{

  return{id:uid(),name:String(j.title||'Scheda importata').slice(0,60),days,weeks:clampInt(j.weeks,1,52,8),start:todayStr(),deload:[],archived:false,created:Date.now(),notes:String(j.notes||'').slice(0,300),newLib};
}

  case'later':{const p=+b.dataset.pos;const sl=s.order.splice(p,1)[0];s.order.push(sl);s.moved[sl]=true;persist(s);cur=null;render();return}
  case'swap':{const slot=+b.dataset.slot,orig=activeProg().days[dayIdx].ex[slot][0],c=slotEx(s,slot);const opts=[orig,...(X(orig).a||[])].filter((v,i,a)=>a.indexOf(v)===i);
    openSheet(`<span class="eyebrow">${esc(X(orig).m)}</span><h2>Scegli un'alternativa</h2><p class="note">Stesse serie e ripetizioni. I carichi si salvano sull'esercizio che fai davvero.</p>${opts.map(id=>`<button class="alt${id===c?' on':''}" data-act="pick-alt" data-slot="${slot}" data-id="${id}"><span>${esc(X(id).n)}${id===orig?' <small>(originale)</small>':''}</span><small>${id===c?'in uso':''}</small></button>`).join('')}<button class="btn" data-act="alt-other" data-slot="${slot}">Cerca un altro esercizio</button>`);return}
  case'pick-alt':{const slot=+b.dataset.slot,id=b.dataset.id,orig=activeProg().days[dayIdx].ex[slot][0];if(id===orig)delete s.subs[slot];else s.subs[slot]=id;persist(s);closeSheet();cur=null;render();return}
  case'alt-other':closeSheet();pickerSheet({type:'alt',slot:+b.dataset.slot});return;
  case'finish':{s.end=Date.now();s.finished=true;persist(s);render();summarySheet(s.id);return}
  }
  switch(act){
  case'name-edit':openSheet(`<h2>Nome dell'atleta</h2><input class="search" id="name-in" maxlength="40" autocomplete="name" value="${esc(prefs.name||'')}" placeholder="Es. Marco Rossi"><button class="btn primary block" data-act="name-save">Salva</button>`);setTimeout(()=>{const i=$('#name-in');if(i)i.focus()},60);return;
  case'name-save':prefs.name=($('#name-in').value||'').trim().slice(0,40);savePrefs();closeSheet();render();return;
  case'exinfo':exInfoSheet(b.dataset.ex);return;
  case'exinfo-save':{const id=b.dataset.ex,n=$('#ex-note').value.trim(),gk=num($('#g-kg').value),gr=parseInt($('#g-reps').value);if(n)prefs.notes[id]=n;else delete prefs.notes[id];if(gk>0||gr>0)prefs.goals[id]={kg:gk>0?gk:'',reps:gr>0?gr:''};else delete prefs.goals[id];savePrefs();closeSheet();toast('Salvato');render();return}
  case'summary':summarySheet(b.dataset.id);return;
  case'calday':{const ids=trainedSessions().filter(x=>x.date===b.dataset.d);if(ids.length)summarySheet(ids[0].id);return}
  case'cal':{calMonth.m+=+b.dataset.d;if(calMonth.m<0){calMonth.m=11;calMonth.y--}if(calMonth.m>11){calMonth.m=0;calMonth.y++}render();return}
  case'libm':libM=b.dataset.m;render();return;
  case'lib-new':pickerSheet({type:'lib'});return;
  /* schede */
  case'activate':{progDoc.active=b.dataset.id;const p=activeProg();p.archived=false;if(!trainedSessions().some(x=>sessProg(x)===p.id))p.start=todayStr();saveProgs();dayIdx=nextDay();cur=null;toast('Scheda attiva: '+p.name);render();return}
  case'edit':editProgram(programs().find(p=>p.id===b.dataset.id),false,false);return;
  case'dup':{const o=programs().find(p=>p.id===b.dataset.id),c=clone(o);c.id=uid();c.name=(o.name+' (copia)').slice(0,60);c.start=todayStr();c.archived=false;c.days.forEach(d=>d.id='d'+uid());progDoc.list.push(c);saveProgs();toast('Scheda duplicata');render();return}
  case'archive':case'unarchive':{const p=programs().find(x=>x.id===b.dataset.id);p.archived=act==='archive';saveProgs();render();return}
  case'del':confirmDel=b.dataset.id;render();return;
  case'del-no':confirmDel=null;render();return;
  case'del-yes':progDoc.list=programs().filter(p=>p.id!==b.dataset.id);confirmDel=null;saveProgs();toast('Scheda eliminata, storico conservato');render();return;
  case'extend':{const p=programs().find(x=>x.id===b.dataset.id);p.weeks=(p.weeks||8)+ +b.dataset.w;saveProgs();toast('Scheda prolungata a '+p.weeks+' settimane');render();return}
  case'new-prog':editProgram({id:uid(),name:'Nuova scheda',days:[newDay(0)],weeks:8,start:todayStr(),deload:[],archived:false,created:Date.now()},true,false);return;
  case'import':openImport();return;
  case'imp-go':b.disabled=true;runImport().finally(()=>{b.disabled=false});return;
  case'export-xlsx':exportXlsx();return;
  case'export-pdf':exportPdf();return;
  /* editor */
  case'dl':{const w=+b.dataset.w,a=draft.deload=draft.deload||[];const i=a.indexOf(w);if(i>=0)a.splice(i,1);else a.push(w);a.sort((x,y)=>x-y);b.setAttribute('aria-pressed',i<0);return}
  case'dmove':{const i=+b.dataset.i,j=i+ +b.dataset.d;[draft.days[i],draft.days[j]]=[draft.days[j],draft.days[i]];render();return}
  case'dadd':draft.days.push(newDay(draft.days.length));render();return;
  case'ddel':draft.days.splice(+b.dataset.d,1);render();return;
  case'eadd':pickerSheet({type:'add',d:+b.dataset.d});return;
  case'edel':draft.days[+b.dataset.d].ex.splice(+b.dataset.e,1);render();return;
  case'emove':{const ex=draft.days[+b.dataset.d].ex,i=+b.dataset.e,j=i+ +b.dataset.x;[ex[i],ex[j]]=[ex[j],ex[i]];render();return}
  case'pick-ex':pickerSheet({type:'set',d:+b.dataset.d,e:+b.dataset.e});return;
  case'pick-one':case'pick-new':{
    let id=b.dataset.id;
    if(act==='pick-new'){const name=$('#pickq').value.trim();if(!name)return;id='x-'+norm(name).replace(/ /g,'-').slice(0,40);const entry={n:name.slice(0,60),m:$('#newmus').value,t:[],a:[]};
      if(pickCtx&&pickCtx.type!=='lib'&&pickCtx.type!=='alt'&&draft){draft.newLib[id]=entry}else{prefs.lib[id]=entry;savePrefs()}}
    const c=pickCtx;closeSheet();if(!c)return;
    if(c.type==='lib'){render();exInfoSheet(id);return}
    if(c.type==='alt'){const s2=getSession();s2.subs[c.slot]=id;persist(s2);cur=null;render();return}
    if(c.type==='add')draft.days[c.d].ex.push([id,3,8,12,'1',90,'','','']);else if(c.type==='set')draft.days[c.d].ex[c.e][0]=id;
    render();return}
  case'ed-save':saveDraft(draftIsNew||progDoc.active===draft.id);return;
  case'ed-save-only':saveDraft(false);return;
  case'ed-cancel':draft=null;location.hash='schede';return;
  /* backup */
  case'bk-export':exportBackup();return;
  case'bk-apply':{const j=bkPending;bkPending=null;if(j)applyBackup(j);return}
  case'bk-cancel':bkPending=null;bkStatus('');return;
  case'bk-auto':{const ab=ls.get('pd-autobackup-prev',null);if(ab){bkPending=ab.data;$('#bk-status').innerHTML=`<div class="confirm">Recuperi la copia del ${fmtDate(ab.date)}? Viene unita ai dati attuali senza cancellare niente.<div class="actions"><button class="btn small primary" data-act="bk-apply">Recupera</button><button class="btn small" data-act="bk-cancel">Annulla</button></div></div>`}return}
  }
});
const VIEWS=['allenamento','progressi','schede','libreria','profilo','edit'];
function route(){const h=location.hash.slice(1);let v=VIEWS.includes(h)?h:'allenamento';if(v==='edit'&&!draft)v='schede';if(v!=='edit'&&view==='edit'&&draft&&h!=='edit'){draft=null}view=v;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
route();

</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script></body></html>
